name: Build & Release Android App

# Ce pipeline se déclenche UNIQUEMENT quand vous poussez un tag qui commence par "v"
on:
  push:
    tags:
      - "v*" # ex: v1.0.0, v1.0.1, etc.

jobs:
  build-android:
    runs-on: windows-latest # Windows est souvent requis pour MAUI/Visual Studio
    
    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Installer .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Installer la charge de travail MAUI Android
      run: dotnet workload install maui-android

    - name: Restaurer les dépendances
      run: dotnet restore

    - name: Compiler et Publier l'APK
      # Remplacez "Scouty.Frontend.csproj" par le chemin de votre projet
      run: |
        dotnet publish Scouty.Frontend/Scouty.Frontend.csproj -f net8.0-android -c Release -p:AndroidPackageFormats=apk -o build_output

    - name: Signer l'APK (Optionnel pour le debug, Requis pour le PlayStore)
      # Pour l'instant, dotnet génère un APK signé avec une clé de debug, suffisant pour tester
      # Pour une vraie release, il faudrait une étape de signature ici (jarsigner)
      run: echo "Build terminé"

    - name: Créer la Release GitHub
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build_output/*.apk # On prend le fichier généré
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Token automatique fourni par GitHub