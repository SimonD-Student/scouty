name: Build & Release Android App

# Ce pipeline se déclenche UNIQUEMENT quand vous poussez un tag qui commence par "v"
on:
  push:
    tags:
      - "v*" # ex: v1.0.0, v1.0.1, etc.

jobs:
  build-android:
    runs-on: windows-latest # Windows est souvent requis pour MAUI/Visual Studio
    
    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Installer .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # CORRECTION 1 : Au lieu d'installer juste "maui-android", on demande à dotnet
    # d'installer TOUT ce que le projet demande (y compris iOS) pour ne pas bloquer.
    - name: Installer les workloads requis (Restore)
      run: dotnet workload restore

    # CORRECTION 2 : On ajoute "-p:CheckEolTargetFramework=false" pour ignorer l'erreur "Out of support"
    # On spécifie bien qu'on ne restaure et publie QUE pour Android (-f net8.0-android)
    - name: Compiler et Publier l'APK
      run: |
        dotnet publish Scouty.Frontend/Scouty.Frontend.csproj -f net8.0-android -c Release -p:AndroidPackageFormats=apk -p:CheckEolTargetFramework=false -o build_output

    - name: Créer la Release GitHub
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build_output/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}