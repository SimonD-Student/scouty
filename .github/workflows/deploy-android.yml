name: Build Android App

on:
  push:
    branches: [ "dev" ]
    paths:
      - 'Scouty.Frontend/**'
      - 'Scouty.Shared/**'
      - '.github/workflows/deploy-android.yml'

jobs:
  build-android:
    runs-on: windows-latest # Windows est requis pour MAUI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Installation de Java 17 (Obligatoire pour Android avec .NET 8)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      # 2. Installation de .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 3. LE CORRECTIF : On installe TOUS les workloads demandés par le projet
      # Au lieu de juste "maui-android", on laisse .NET décider.
      - name: Install MAUI Workloads
        run: dotnet workload restore

      # 4. Décodage du Keystore (ATTENTION : Tu dois avoir créé le secret avant !)
      - name: Decode Keystore
        run: |
          if ("${{ secrets.ANDROID_KEYSTORE_BASE64 }}" -ne "") {
              $bytes = [System.Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
              [IO.File]::WriteAllBytes("scouty.keystore", $bytes)
          } else {
              Write-Error "Le secret ANDROID_KEYSTORE_BASE64 est vide ou manquant !"
          }

      # 5. Construction et Signature
      - name: Publish Android App
        run: |
          dotnet publish Scouty.Frontend/Scouty.Frontend.csproj `
            -f net8.0-android `
            -c Release `
            -p:AndroidPackageFormat=aab `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="scouty.keystore" `
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" `
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      # 6. Sauvegarde du fichier généré
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scouty-Android-Bundle
          path: Scouty.Frontend/bin/Release/net8.0-android/publish/*-Signed.aab