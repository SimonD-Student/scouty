name: Build Android App

on:
  push:
    branches: [ "dev" ]
    paths:
      - 'Scouty.Frontend/**'
      - 'Scouty.Shared/**'
      - '.github/workflows/deploy-android.yml'

env:
  # On désactive la vérification de date (EOL) globalement
  CheckEolTargetFramework: false
  # On dit à .NET d'ignorer tout ce qui n'est pas .NET 8
  DOTNET_MULTILEVEL_LOOKUP: 0

jobs:
  build-android:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # NOUVEAU : On crée le fichier global.json pour FORCER la version 8.0.404
      # Cela empêche le serveur d'utiliser .NET 10 ou 9 par erreur.
      - name: Create global.json
        run: |
          New-Item -Path . -Name "global.json" -ItemType "file" -Value '{ "sdk": { "version": "8.0.404", "rollForward": "latestFeature" } }' -Force

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.404 # On aligne cette version avec le global.json

      # INSTALLATION MUSCLÉE
      # On installe tout le paquet 'maui', pas juste android, pour être sûr d'avoir les libs de base.
      - name: Install MAUI Workloads
        run: dotnet workload install maui --ignore-failed-sources

      - name: Decode Keystore
        run: |
          if ("${{ secrets.ANDROID_KEYSTORE_BASE64 }}" -ne "") {
              $bytes = [System.Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
              [IO.File]::WriteAllBytes("scouty.keystore", $bytes)
          }

      - name: Publish Android App
        run: |
          dotnet publish Scouty.Frontend/Scouty.Frontend.csproj `
            -f net8.0-android `
            -c Release `
            -p:AndroidPackageFormat=aab `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="scouty.keystore" `
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" `
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
            -p:TreatWarningsAsErrors=false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scouty-Android-Bundle
          path: Scouty.Frontend/bin/Release/net8.0-android/publish/*-Signed.aab