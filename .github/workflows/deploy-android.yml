name: Build Android App

on:
  push:
    branches: [ "dev" ]
    paths:
      - 'Scouty.Frontend/**'
      - 'Scouty.Shared/**'
      - '.github/workflows/deploy-android.yml'

jobs:
  build-android:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MAUI Workloads
        run: dotnet workload restore

      - name: Decode Keystore
        run: |
          if ("${{ secrets.ANDROID_KEYSTORE_BASE64 }}" -ne "") {
              $bytes = [System.Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
              [IO.File]::WriteAllBytes("scouty.keystore", $bytes)
          }

      # ATTENTION : La syntaxe ici est critique (backticks ` en fin de ligne)
      - name: Publish Android App
        run: |
          dotnet publish Scouty.Frontend/Scouty.Frontend.csproj `
            -f net8.0-android34.0 `
            -c Release `
            -p:AndroidPackageFormat=aab `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="scouty.keystore" `
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" `
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
            -p:TreatWarningsAsErrors=false `
            -p:CheckEolTargetFramework=false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scouty-Android-Bundle
          path: Scouty.Frontend/bin/Release/net8.0-android34.0/publish/*-Signed.aab