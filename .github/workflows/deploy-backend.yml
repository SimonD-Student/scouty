name: Deploy Backend to VPS

on:
  push:
    branches: [ "dev" ] # Se déclenche quand tu pushes sur la branche dev
    paths:
      - 'Scouty.Backend/**' # Uniquement si on modifie le backend
      - '.github/workflows/deploy-backend.yml' # Ou ce fichier

env:
  REGISTRY: ghcr.io
  # Ton nom d'image (Doit correspondre à ton GitHub username en minuscule / nom du repo)
  IMAGE_NAME: simond-student/scouty 

jobs:
  # JOB 1 : CONSTRUIRE L'IMAGE ET L'ENVOYER SUR GITHUB
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Scouty.Backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # JOB 2 : SE CONNECTER AU VPS ET METTRE A JOUR
  deploy:
    needs: build-and-push # Attend que le build soit fini
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # On va dans le dossier préparé à la Phase 3
            cd /opt/scouty-backend
            
            # On s'assure d'être connecté au registre pour pouvoir télécharger l'image privée
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # On télécharge la dernière version de l'image qu'on vient de construire
            docker compose pull backend
            
            # On recrée le conteneur backend (la DB ne bouge pas grâce au --no-deps)
            docker compose up -d --no-deps backend
            
            # Nettoyage des vieilles images pour économiser de la place sur le VPS
            docker image prune -f